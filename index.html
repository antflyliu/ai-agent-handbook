<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI Agent Handbook</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 官方 Vue 经典主题，排版稳健 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* 彻底修复左侧空白与容器溢出问题 */
    :root {
      --sidebar-width: 320px;
    }
    
    /* 侧边栏贴紧左侧并限制合适宽度 */
    .sidebar {
      left: 0 !important;
      width: var(--sidebar-width) !important;
      border-right: 1px solid #eaecef;
    }

    /* 主体内容区在大屏下保持正常边距，阅读舒适 */
    .content {
      padding-left: var(--sidebar-width) !important;
      position: static !important;
    }

    .markdown-section {
      max-width: 950px !important;
      padding: 30px 40px 60px 40px !important;
      margin: 0 auto;
    }

    /* 优化搜索框内边距 */
    .sidebar .search {
      margin-bottom: 12px;
      padding: 0 16px;
    }

    .sidebar .search input {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
    }

    /* 代码块与表格优化 */
    .markdown-section pre > code {
      font-size: 0.92rem;
      border-radius: 6px;
    }

    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse;
      margin: 20px 0;
    }

    /* 移动端自适应适配 */
    @media screen and (max-width: 768px) {
      .content {
        padding-left: 0 !important;
      }
      .markdown-section {
        padding: 20px 15px !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: 'AI Agent Handbook',
      repo: 'aliyun/ai-agent-handbook',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: '搜索文档',
        noData: '未找到结果',
        depth: 3,
        pathNamespaces: ['/']
      },
      copyCode: {
        buttonText: '复制',
        error: '错误',
        success: '已复制'
      }
    }
  </script>

  <!-- 核心与核心插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
